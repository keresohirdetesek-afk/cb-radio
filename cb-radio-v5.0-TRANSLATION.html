<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CB Rádió v5.0 - Fordítás</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900">
    <div id="app"></div>
    <script>
        const WS_SERVER = 'wss://cb-radio-production.up.railway.app';
        const TRANSLATE_SERVER = 'https://keresohirdetesek-afk.github.io/cb-radio/cb-radio-standalone.html'; // ← CSERÉLD KI!
        
        const ICE_SERVERS = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' },
                { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' }
            ]
        };

        const LANGUAGES = {
            hu: { name: 'Magyar', flag: '🇭🇺', voice: 'hu-HU' },
            en: { name: 'English', flag: '🇬🇧', voice: 'en-US' },
            de: { name: 'Deutsch', flag: '🇩🇪', voice: 'de-DE' },
            fr: { name: 'Français', flag: '🇫🇷', voice: 'fr-FR' },
            es: { name: 'Español', flag: '🇪🇸', voice: 'es-ES' },
            ro: { name: 'Română', flag: '🇷🇴', voice: 'ro-RO' }
        };

        class CBRadio {
            constructor() {
                this.channel = 19;
                this.isTransmitting = false;
                this.isMuted = false;
                this.isConnected = false;
                this.peers = [];
                this.activePeers = new Set();
                this.volume = 0;
                this.rogerBeepEnabled = true;
                this.localStream = null;
                this.peerConnections = {};
                this.ws = null;
                this.audioContext = null;
                this.analyser = null;
                this.userId = null;
                this.spacePressed = false;
                
                // Translation features
                this.translationEnabled = false;
                this.myLanguage = 'hu';
                this.targetLanguage = 'en';
                this.recognition = null;
                this.isRecognizing = false;
                this.speechSynthesis = window.speechSynthesis;
                this.currentUtterance = null;
                
                window.addEventListener('beforeunload', () => this.cleanup());
                this.init();
            }
            
            cleanup() {
                Object.values(this.peerConnections).forEach(pc => pc && pc.close());
                if (this.ws) this.ws.close();
                if (this.localStream) this.localStream.getTracks().forEach(t => t.stop());
                if (this.audioContext) this.audioContext.close();
                if (this.recognition) this.recognition.stop();
                if (this.speechSynthesis) this.speechSynthesis.cancel();
            }
            
            async init() {
                await this.setupAudio();
                this.connectWebSocket();
                this.setupEventListeners();
                this.loadSettings();
                this.render();
            }
            
            async setupAudio() {
                try {
                    this.localStream = await navigator.mediaDevices.getUserMedia({
                        audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
                    });
                    this.localStream.getAudioTracks().forEach(track => track.enabled = false);
                    this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    this.analyser = this.audioContext.createAnalyser();
                    const source = this.audioContext.createMediaStreamSource(this.localStream);
                    source.connect(this.analyser);
                    this.analyser.fftSize = 256;
                    this.isConnected = true;
                    this.render();
                } catch (error) {
                    alert('Kérlek engedélyezd a mikrofon hozzáférést!');
                }
            }
            
            setupSpeechRecognition() {
                if (!('webkitSpeechRecognition' in window)) {
                    console.log('Speech recognition not supported');
                    return;
                }
                
                this.recognition = new webkitSpeechRecognition();
                this.recognition.lang = LANGUAGES[this.myLanguage].voice;
                this.recognition.continuous = false;
                this.recognition.interimResults = false;
                
                this.recognition.onresult = async (event) => {
                    const transcript = event.results[0][0].transcript;
                    const confidence = event.results[0][0].confidence;
                    
                    console.log(`📝 Felismert (${this.myLanguage}): "${transcript}" (${Math.round(confidence * 100)}%)`);
                    
                    if (confidence > 0.6) {
                        await this.translateAndBroadcast(transcript);
                    }
                };
                
                this.recognition.onerror = (event) => {
                    console.error('Speech recognition error:', event.error);
                    this.isRecognizing = false;
                };
                
                this.recognition.onend = () => {
                    this.isRecognizing = false;
                };
            }
            
            async translateAndBroadcast(text) {
                try {
                    console.log(`🔄 Fordítás: ${this.myLanguage} → ${this.targetLanguage}`);
                    
                    const response = await fetch(`${TRANSLATE_SERVER}/translate`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            text: text,
                            sourceLang: this.myLanguage,
                            targetLang: this.targetLanguage
                        })
                    });
                    
                    if (!response.ok) throw new Error('Translation failed');
                    
                    const data = await response.json();
                    const translatedText = data.translatedText;
                    
                    console.log(`✅ Fordítva: "${translatedText}"`);
                    
                    // Send translated text to peers
                    if (this.ws && this.ws.readyState === WebSocket.OPEN) {
                        this.ws.send(JSON.stringify({
                            type: 'translated-speech',
                            text: translatedText,
                            lang: this.targetLanguage,
                            userId: this.userId
                        }));
                    }
                    
                } catch (error) {
                    console.error('Translation error:', error);
                }
            }
            
            speakTranslatedText(text, lang) {
                // Stop previous speech
                this.speechSynthesis.cancel();
                
                // Mute incoming WebRTC audio during TTS
                const audioElements = document.querySelectorAll('audio[id^="audio-"]');
                audioElements.forEach(audio => audio.volume = 0);
                
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = LANGUAGES[lang].voice;
                utterance.rate = 1.0;
                utterance.pitch = 1.0;
                utterance.volume = 1.0;
                
                utterance.onend = () => {
                    // Restore audio volume
                    audioElements.forEach(audio => audio.volume = 1.0);
                    console.log('🔊 TTS finished');
                };
                
                console.log(`🔊 Felolvasom (${lang}): "${text}"`);
                this.speechSynthesis.speak(utterance);
                this.currentUtterance = utterance;
            }
            
            connectWebSocket() {
                this.ws = new WebSocket(WS_SERVER);
                this.ws.onopen = () => {
                    this.isConnected = true;
                    this.joinChannel(this.channel);
                    this.render();
                };
                this.ws.onmessage = (event) => this.handleWebSocketMessage(JSON.parse(event.data));
                this.ws.onclose = () => {
                    this.isConnected = false;
                    this.render();
                    setTimeout(() => this.connectWebSocket(), 3000);
                };
            }
            
            async handleWebSocketMessage(data) {
                switch (data.type) {
                    case 'channel-joined':
                        this.userId = data.userId;
                        this.peers = data.peers;
                        for (const peerId of data.peers) await this.createPeerConnection(peerId, true);
                        this.render();
                        break;
                    case 'peer-joined':
                        if (!this.peers.includes(data.userId)) this.peers.push(data.userId);
                        this.render();
                        break;
                    case 'peer-left':
                        this.peers = this.peers.filter(id => id !== data.userId);
                        this.closePeerConnection(data.userId);
                        this.render();
                        break;
                    case 'offer':
                        await this.handleOffer(data);
                        break;
                    case 'answer':
                        await this.handleAnswer(data);
                        break;
                    case 'ice-candidate':
                        await this.handleIceCandidate(data);
                        break;
                    case 'peer-transmitting':
                        if (data.transmitting) this.activePeers.add(data.userId);
                        else this.activePeers.delete(data.userId);
                        this.render();
                        break;
                    case 'translated-speech':
                        if (this.translationEnabled && data.lang === this.myLanguage) {
                            console.log(`📻 Fordított üzenet érkezett: "${data.text}"`);
                            this.speakTranslatedText(data.text, data.lang);
                        }
                        break;
                }
            }
            
            joinChannel(channelId) {
                if (this.ws && this.ws.readyState === WebSocket.OPEN) {
                    this.ws.send(JSON.stringify({ type: 'join-channel', channel: channelId }));
                }
            }
            
            async createPeerConnection(peerId, initiator = false) {
                if (this.peerConnections[peerId]) this.peerConnections[peerId].close();
                const pc = new RTCPeerConnection(ICE_SERVERS);
                this.peerConnections[peerId] = pc;
                if (this.localStream) this.localStream.getTracks().forEach(track => pc.addTrack(track, this.localStream));
                pc.ontrack = (event) => this.playRemoteAudio(event.streams[0], peerId);
                pc.onicecandidate = (event) => {
                    if (event.candidate && this.ws) {
                        this.ws.send(JSON.stringify({ type: 'ice-candidate', candidate: event.candidate, to: peerId }));
                    }
                };
                if (initiator) {
                    const offer = await pc.createOffer();
                    await pc.setLocalDescription(offer);
                    if (this.ws) this.ws.send(JSON.stringify({ type: 'offer', offer: pc.localDescription, to: peerId }));
                }
                return pc;
            }
            
            async handleOffer(data) {
                const pc = await this.createPeerConnection(data.from);
                await pc.setRemoteDescription(new RTCSessionDescription(data.offer));
                const answer = await pc.createAnswer();
                await pc.setLocalDescription(answer);
                if (this.ws) this.ws.send(JSON.stringify({ type: 'answer', answer: pc.localDescription, to: data.from }));
            }
            
            async handleAnswer(data) {
                const pc = this.peerConnections[data.from];
                if (pc && pc.signalingState !== 'stable') await pc.setRemoteDescription(new RTCSessionDescription(data.answer));
            }
            
            async handleIceCandidate(data) {
                const pc = this.peerConnections[data.from];
                if (pc && pc.remoteDescription) await pc.addIceCandidate(new RTCIceCandidate(data.candidate)).catch(() => {});
            }
            
            closePeerConnection(peerId) {
                if (this.peerConnections[peerId]) this.peerConnections[peerId].close();
                delete this.peerConnections[peerId];
                const audioEl = document.getElementById(`audio-${peerId}`);
                if (audioEl) audioEl.remove();
            }
            
            playRemoteAudio(stream, peerId) {
                if (this.translationEnabled) {
                    // Ha fordítás be van kapcsolva, némítjuk az eredeti hangot
                    // (mert a fordított szöveget TTS-sel olvassuk fel)
                    return;
                }
                
                let audioElement = document.getElementById(`audio-${peerId}`);
                if (!audioElement) {
                    audioElement = document.createElement('audio');
                    audioElement.id = `audio-${peerId}`;
                    audioElement.autoplay = true;
                    audioElement.playsInline = true;
                    document.body.appendChild(audioElement);
                }
                audioElement.srcObject = stream;
                audioElement.volume = 1.0;
                audioElement.play().catch(() => {});
            }
            
            playAuthenticCBRogerBeep() {
                if (!this.rogerBeepEnabled || !this.audioContext) return;
                const currentTime = this.audioContext.currentTime;
                const osc1 = this.audioContext.createOscillator();
                const gain1 = this.audioContext.createGain();
                osc1.connect(gain1);
                gain1.connect(this.audioContext.destination);
                osc1.frequency.value = 1750;
                osc1.type = 'sine';
                gain1.gain.setValueAtTime(0.25, currentTime);
                gain1.gain.exponentialRampToValueAtTime(0.01, currentTime + 0.08);
                osc1.start(currentTime);
                osc1.stop(currentTime + 0.08);
                const osc2 = this.audioContext.createOscillator();
                const gain2 = this.audioContext.createGain();
                osc2.connect(gain2);
                gain2.connect(this.audioContext.destination);
                osc2.frequency.value = 1450;
                osc2.type = 'sine';
                gain2.gain.setValueAtTime(0, currentTime + 0.09);
                gain2.gain.setValueAtTime(0.25, currentTime + 0.09);
                gain2.gain.exponentialRampToValueAtTime(0.01, currentTime + 0.21);
                osc2.start(currentTime + 0.09);
                osc2.stop(currentTime + 0.21);
            }
            
            startTransmission() {
                if (!this.isConnected || this.isMuted) return;
                this.isTransmitting = true;
                if (this.localStream) this.localStream.getAudioTracks().forEach(track => track.enabled = true);
                if (this.ws) this.ws.send(JSON.stringify({ type: 'start-transmission' }));
                
                // Start speech recognition if translation enabled
                if (this.translationEnabled && this.recognition && !this.isRecognizing) {
                    try {
                        this.recognition.start();
                        this.isRecognizing = true;
                        console.log('🎤 Speech recognition started');
                    } catch (e) {
                        console.log('Recognition already started');
                    }
                }
                
                this.measureVolume();
                this.render();
            }
            
            stopTransmission() {
                this.isTransmitting = false;
                if (this.localStream) this.localStream.getTracks().forEach(track => track.enabled = false);
                if (this.ws) this.ws.send(JSON.stringify({ type: 'stop-transmission' }));
                this.volume = 0;
                
                // Stop speech recognition
                if (this.recognition && this.isRecognizing) {
                    try {
                        this.recognition.stop();
                        this.isRecognizing = false;
                    } catch (e) {}
                }
                
                this.playAuthenticCBRogerBeep();
                this.render();
            }
            
            measureVolume() {
                if (!this.analyser || !this.isTransmitting) return;
                const dataArray = new Uint8Array(this.analyser.frequencyBinCount);
                this.analyser.getByteFrequencyData(dataArray);
                const average = dataArray.reduce((a, b) => a + b) / dataArray.length;
                this.volume = Math.min(100, (average / 255) * 100);
                this.render();
                if (this.isTransmitting) requestAnimationFrame(() => this.measureVolume());
            }
            
            toggleMute() {
                this.isMuted = !this.isMuted;
                if (this.isTransmitting) this.stopTransmission();
                this.render();
            }
            
            toggleRogerBeep() {
                this.rogerBeepEnabled = !this.rogerBeepEnabled;
                this.render();
            }
            
            toggleTranslation() {
                this.translationEnabled = !this.translationEnabled;
                if (this.translationEnabled) {
                    this.setupSpeechRecognition();
                } else {
                    if (this.recognition) {
                        this.recognition.stop();
                        this.recognition = null;
                    }
                    if (this.speechSynthesis) {
                        this.speechSynthesis.cancel();
                    }
                }
                this.saveSettings();
                this.render();
            }
            
            setMyLanguage(lang) {
                this.myLanguage = lang;
                if (this.recognition) {
                    this.recognition.lang = LANGUAGES[lang].voice;
                }
                this.saveSettings();
                this.render();
            }
            
            setTargetLanguage(lang) {
                this.targetLanguage = lang;
                this.saveSettings();
                this.render();
            }
            
            changeChannel(newChannel) {
                Object.keys(this.peerConnections).forEach(peerId => this.closePeerConnection(peerId));
                this.peers = [];
                this.activePeers.clear();
                this.channel = newChannel;
                this.joinChannel(newChannel);
                this.render();
            }
            
            saveSettings() {
                localStorage.setItem('cbRadioTranslationEnabled', this.translationEnabled);
                localStorage.setItem('cbRadioMyLanguage', this.myLanguage);
                localStorage.setItem('cbRadioTargetLanguage', this.targetLanguage);
            }
            
            loadSettings() {
                const enabled = localStorage.getItem('cbRadioTranslationEnabled');
                if (enabled === 'true') {
                    this.translationEnabled = true;
                    this.setupSpeechRecognition();
                }
                this.myLanguage = localStorage.getItem('cbRadioMyLanguage') || 'hu';
                this.targetLanguage = localStorage.getItem('cbRadioTargetLanguage') || 'en';
            }
            
            setupEventListeners() {
                window.addEventListener('keydown', (e) => {
                    if (!this.spacePressed && e.code === 'Space') {
                        e.preventDefault();
                        this.spacePressed = true;
                        this.startTransmission();
                    }
                });
                window.addEventListener('keyup', (e) => {
                    if (this.spacePressed && e.code === 'Space') {
                        e.preventDefault();
                        this.spacePressed = false;
                        this.stopTransmission();
                    }
                });
            }
            
            render() {
                document.getElementById('app').innerHTML = `
                    <div class="min-h-screen bg-gradient-to-br from-gray-900 via-gray-800 to-black flex items-center justify-center p-4">
                        <div class="w-full max-w-md">
                            <div class="bg-gradient-to-b from-gray-800 to-gray-900 rounded-3xl shadow-2xl border-4 border-gray-700">
                                <div class="px-6 py-3" style="background: linear-gradient(135deg, #fef08a 0%, #fde047 100%);">
                                    <div class="flex items-center justify-between mb-1">
                                        <span class="text-gray-900 font-bold text-lg">📻 CB RÁDIÓ v5.0</span>
                                        <span class="text-xs font-semibold ${this.isConnected ? 'text-green-600' : 'text-red-600'}">
                                            ${this.isConnected ? '● ONLINE' : '○ OFFLINE'}
                                        </span>
                                    </div>
                                    <div class="text-center">
                                        <span class="font-bold" style="color: #dc2626;">pilot</span><span class="font-bold text-black">RADAR</span><span class="text-black text-sm">.hu</span>
                                    </div>
                                </div>
                                <div class="bg-gradient-to-b from-green-900 to-green-950 p-6 border-y-4 border-gray-700">
                                    <div class="bg-black rounded-lg p-4">
                                        <div class="text-center mb-4">
                                            <div class="text-green-400 font-mono text-sm mb-1">CSATORNA</div>
                                            <div class="text-green-400 font-mono text-6xl font-bold">${String(this.channel).padStart(2, '0')}</div>
                                            <div class="text-green-400 font-mono text-xs mt-2">👥 ${this.peers.length} FELHASZNÁLÓ</div>
                                        </div>
                                        ${this.isTransmitting ? `
                                            <div class="mt-4">
                                                <div class="text-green-400 font-mono text-xs mb-2 text-center">ADÁS ${this.translationEnabled ? '+ FORDÍTÁS' : ''}</div>
                                                <div class="h-3 bg-gray-900 rounded-full border border-green-800">
                                                    <div class="h-full bg-gradient-to-r from-green-600 to-green-400" style="width: ${this.volume}%"></div>
                                                </div>
                                            </div>
                                        ` : this.activePeers.size > 0 ? `
                                            <div class="mt-4 text-center">
                                                <div class="text-yellow-400 font-mono text-xs animate-pulse">VÉTEL...</div>
                                            </div>
                                        ` : `
                                            <div class="mt-4 text-center">
                                                <div class="text-green-400 font-mono text-xs animate-pulse">KÉSZENLÉTI</div>
                                            </div>
                                        `}
                                    </div>
                                </div>
                                <div class="p-6 bg-gray-800 space-y-4">
                                    <div>
                                        <label class="text-gray-300 text-sm font-semibold mb-2 block">Csatorna (1-40)</label>
                                        <div class="flex gap-2">
                                            <button id="channelDown" class="bg-gray-700 hover:bg-gray-600 text-white px-4 py-3 rounded-lg font-bold">◀</button>
                                            <input type="range" id="channelSlider" min="1" max="40" value="${this.channel}" class="flex-1">
                                            <button id="channelUp" class="bg-gray-700 hover:bg-gray-600 text-white px-4 py-3 rounded-lg font-bold">▶</button>
                                        </div>
                                    </div>
                                    
                                    <div class="grid grid-cols-2 gap-3">
                                        <button id="rogerBtn" class="px-4 py-3 rounded-lg font-semibold text-sm ${this.rogerBeepEnabled ? 'bg-green-600' : 'bg-gray-700'} text-white">
                                            ${this.rogerBeepEnabled ? '🔔 BEEP: BE' : '🔕 BEEP: KI'}
                                        </button>
                                        <button id="muteBtn" class="px-4 py-3 rounded-lg font-semibold text-sm ${this.isMuted ? 'bg-red-600' : 'bg-gray-700'} text-white">
                                            ${this.isMuted ? '🔇 NÉMÍTVA' : '🔊 HANG BE'}
                                        </button>
                                    </div>
                                    
                                    <button id="translateBtn" class="w-full px-4 py-3 rounded-lg font-semibold text-sm ${this.translationEnabled ? 'bg-blue-600' : 'bg-gray-700'} text-white">
                                        ${this.translationEnabled ? '🌐 FORDÍTÁS: BE' : '🌐 FORDÍTÁS: KI'}
                                    </button>
                                    
                                    ${this.translationEnabled ? `
                                        <div class="bg-gray-700 rounded-lg p-4">
                                            <div class="grid grid-cols-2 gap-3 mb-3">
                                                <div>
                                                    <label class="text-gray-300 text-xs mb-1 block">Én beszélek:</label>
                                                    <select id="myLangSelect" class="w-full bg-gray-600 text-white px-2 py-2 rounded text-sm">
                                                        ${Object.entries(LANGUAGES).map(([code, lang]) => 
                                                            `<option value="${code}" ${this.myLanguage === code ? 'selected' : ''}>${lang.flag} ${lang.name}</option>`
                                                        ).join('')}
                                                    </select>
                                                </div>
                                                <div>
                                                    <label class="text-gray-300 text-xs mb-1 block">Hallja mint:</label>
                                                    <select id="targetLangSelect" class="w-full bg-gray-600 text-white px-2 py-2 rounded text-sm">
                                                        ${Object.entries(LANGUAGES).map(([code, lang]) => 
                                                            `<option value="${code}" ${this.targetLanguage === code ? 'selected' : ''}>${lang.flag} ${lang.name}</option>`
                                                        ).join('')}
                                                    </select>
                                                </div>
                                            </div>
                                            <div class="text-xs text-gray-400 text-center">
                                                ⏱️ ~2 mp késleltetés
                                            </div>
                                        </div>
                                    ` : ''}
                                    
                                    <button id="pttBtn" class="w-full py-12 rounded-2xl font-bold text-2xl shadow-2xl select-none active:scale-95 transition-all ${
                                        this.isTransmitting ? 'bg-gradient-to-b from-red-500 to-red-700 shadow-red-500/50' :
                                        this.isConnected && !this.isMuted ? 'bg-gradient-to-b from-green-500 to-green-700 shadow-green-500/50 hover:shadow-green-500/70' :
                                        'bg-gray-600'
                                    } text-white" ${!this.isConnected || this.isMuted ? 'disabled' : ''}>
                                        ${this.isTransmitting ? '🎤 ADÁS...' : '🎤 NYOMD ÉS BESZÉLJ'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                
                const pttBtn = document.getElementById('pttBtn');
                if (pttBtn) {
                    pttBtn.addEventListener('mousedown', () => this.startTransmission());
                    pttBtn.addEventListener('mouseup', () => this.stopTransmission());
                    pttBtn.addEventListener('touchstart', (e) => { e.preventDefault(); this.startTransmission(); });
                    pttBtn.addEventListener('touchend', (e) => { e.preventDefault(); this.stopTransmission(); });
                }
                
                document.getElementById('muteBtn')?.addEventListener('click', () => this.toggleMute());
                document.getElementById('rogerBtn')?.addEventListener('click', () => this.toggleRogerBeep());
                document.getElementById('translateBtn')?.addEventListener('click', () => this.toggleTranslation());
                document.getElementById('myLangSelect')?.addEventListener('change', (e) => this.setMyLanguage(e.target.value));
                document.getElementById('targetLangSelect')?.addEventListener('change', (e) => this.setTargetLanguage(e.target.value));
                document.getElementById('channelDown')?.addEventListener('click', () => this.changeChannel(Math.max(1, this.channel - 1)));
                document.getElementById('channelUp')?.addEventListener('click', () => this.changeChannel(Math.min(40, this.channel + 1)));
                document.getElementById('channelSlider')?.addEventListener('input', (e) => this.changeChannel(parseInt(e.target.value)));
            }
        }
        
        new CBRadio();
    </script>
</body>
</html>
